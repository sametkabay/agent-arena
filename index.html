    <style>

        height: 1.35rem;
        border-radius: 999px;
        border: 2px solid rgba(122, 158, 126, 0.28);
        border-top-color: #7a9e7e;

    <script type="application/json" id="aa-boot-loading-i18n">
      {
        "en": "Loading the arena…",
        "tr": "Arena yükleniyor…",
        "es": "Cargando la arena…",
        "zh": "正在加载竞技场…",
        "pt": "Carregando a arena…",

        "de": "Arena wird geladen…",
        "ja": "アリーナを読み込み中…",
        "ko": "아레나를 불러오는 중…",
        "ru": "Загрузка арены…"
      }
    </script>
    <script>
      (function () {
        var STORAGE_KEY = "agent-arena-data";
        var table = {};
        try {
          table = JSON.parse(
            document.getElementById("aa-boot-loading-i18n").textContent || "{}",
          );
        } catch (e) {}
        var storedLang;
        var dayNight;
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var data = JSON.parse(raw);
            storedLang = data && data.language;
            dayNight = data && data.dayNight;
          }
        } catch (e) {}
        if (dayNight === "night") {
          document.documentElement.setAttribute("data-day-night", "night");
        }
        function pickLocale() {
          if (storedLang && table[storedLang]) return storedLang;
          var langs = [];
          if (typeof navigator !== "undefined") {
            if (navigator.language) langs.push(navigator.language);
            if (navigator.languages && navigator.languages.length) {
              for (var i = 0; i < navigator.languages.length; i++) {
                langs.push(navigator.languages[i]);
              }
            }
          }
          for (var j = 0; j < langs.length; j++) {
            var low = String(langs[j] || "")
              .trim()
              .toLowerCase();
            if (!low) continue;
            var exact = low.split("-")[0];
            if (table[exact]) return exact;
          }
          return "en";
        }
        var locale = pickLocale();
        var text = table[locale] || table.en || "Loading the arena…";
        var textEl = document.querySelector(".app-loading__text");
        if (textEl) textEl.textContent = text;
        document.documentElement.lang = locale;
      })();
    </script>

        <h1>Agent Arena</h1>
        <p>
          Agent Arena is an open-source, browser-native multi-agent playground.
          You place LLM-powered characters on a 3D map (office, forest, or
          space), watch them idle-talk, and chat with them privately or in a
          shared arena. It runs entirely in the browser with OpenAI, Gemini,
          Claude, or Ollama — no Agent Arena backend.
        </p>
        <p>
          This live page is a WebGL playground and needs JavaScript. Enable JS,
          or open the
          <a href="https://github.com/sametkabay/agent-arena">source repo</a>.
        </p>
        <h2>What you can do</h2>
        <ul>
          <li>Drop personas onto Office, Nature, or Space maps</li>
          <li>Private chat, arena broadcast, and @mention</li>
          <li>Idle speech bubbles while the world runs</li>
          <li>Full-screen map editor with .aamf.json import / export</li>
          <li>YAML config for prompts, roles, characters, and defaults</li>
        </ul>
        <p>
          What this is not: not a hosted multi-agent orchestration framework,
          not a Discord bot, and not a server-side agent runtime.
        </p>
        <p>
